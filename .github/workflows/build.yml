name: Build and Push Custom Hermes Lya Image

on:
  release:
    types: [published]
  workflow_dispatch:

# Ce workflow ne fait que déléguer au workflow réutilisable build-image.yml.
# Il couvre deux chemins d'entrée :
#   - release: published -> une release publiée MANUELLEMENT par un humain
#     déclenche bien un nouveau run (pas de protection anti-récursion), donc on
#     construit avec les tags calver + latest (publish_release_tags: true).
#   - workflow_dispatch -> build manuel : uniquement le tag sha-<commit>
#     (publish_release_tags: false), pour ne pas déplacer `latest` (F-02).
# Les releases créées AUTOMATIQUEMENT par auto-release.yml ne passent PAS ici
# (leur event release: published est supprimé par la protection anti-récursion
# de GitHub) : auto-release.yml appelle directement build-image.yml dans son
# propre run.

jobs:
  build:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      # Une release fournit github.ref = refs/tags/<tag>, donc pas besoin de
      # passer release_tag : metadata-action parse le tag depuis la ref.
      publish_release_tags: ${{ github.event_name == 'release' }}
    secrets: inherit
