name: Renovate

on:
  schedule:
    # Toutes les 6h (00/06/12/18 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Niveau de log Renovate (debug pour diagnostic)"
        type: choice
        default: info
        options:
          - info
          - debug

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          # dry-run: true   # décommenter pour un essai sans ouvrir de PR
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # allowedCommands est une config ADMIN (self-hosted) : elle ne peut PAS
          # être définie dans renovate.json, sinon un dépôt pourrait s'autoriser
          # n'importe quelle commande. C'est donc CETTE ligne qui autorise les
          # `postUpgradeTasks` de renovate.json à s'exécuter ; la retirer les rend
          # silencieusement inopérants et rebranche l'échec de build sur
          # `sha256sum -c` (checksum périmé après un bump de version).
          # Le regex est ANCRÉ (^...$) et ne matche que l'appel au script de
          # synchronisation : ce workflow porte un PAT, un motif permissif (ou un
          # `.*`) y serait un trou d'exécution de commande arbitraire.
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/sync-download-checksums\\.mjs --write --only=[A-Za-z0-9._/-]+$"]'
