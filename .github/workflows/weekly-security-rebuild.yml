name: Weekly Security Rebuild
# Rebuild sans cache BuildKit/GHA chaque lundi matin UTC, pour que les
# correctifs Debian/PyPI invisibles à Renovate (paquets de la base digests-
# épinglée) et le cache GHA (symptôme #69 : couche apt CACHED) ne laissent
# pas des CRITICAL corrigibles jusqu'à ce qu'une PR sans rapport échoue.
#
# Flux :
#   1. build --no-cache + load local (SECURITY_CACHE_BUST = semaine ISO UTC)
#   2. mêmes smokes + porte Trivy CRITICAL que pr-validation
#   3. si la porte échoue → ouvre/met à jour une issue GitHub, PAS de publish
#   4. sinon compare un *content-manifest* (dpkg + freeze venv + versions
#      outils) avec l'image `latest` déjà publiée — PAS le digest d'image
#      (un rebuild no-cache change toujours les timestamps de couches)
#   5. si le manifeste diffère → release calver + build-image (tags calver /
#      latest / sha) pour qu'Image Updater déploie ; sinon log « no change »
#      et exit 0 (pas de redeploy Lya pour rien)
#
# Horaires : cron `15 3 * * 1` = lundi 03:15 UTC
#   → 04:15 Europe/Paris (CET) / 05:15 Europe/Paris (CEST)

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_TAG: hermes-lya-config:weekly-security
  ISSUE_TITLE: "[security] Trivy CRITICAL — rebuild hebdomadaire"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      issues: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      # Garde légère : le build no-cache rejoue déjà `sha256sum -c` sur chaque
      # artefact. Pas de --verify-artifacts ici (coût réseau déjà payé par le
      # rebuild).
      - name: Vérifier les SHA-256 des 3 téléchargements
        run: node scripts/sync-download-checksums.mjs --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SECURITY_CACHE_BUST (semaine ISO UTC)
        id: bust
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build image (no cache, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            SECURITY_CACHE_BUST=${{ steps.bust.outputs.value }}
          no-cache: true
          platforms: linux/amd64

      - name: Smoke test — les 3 outils répondent
        run: |
          set -euo pipefail
          img="${{ env.LOCAL_TAG }}"
          echo "::group::Versions des outils ajoutés"
          docker run --rm --entrypoint gws     "$img" --version
          docker run --rm --entrypoint gh      "$img" --version
          docker run --rm --entrypoint kubectl "$img" version --client
          echo "::endgroup::"

      - name: Smoke test — hermes résolvable (PATH runtime typique K8s)
        run: |
          set -euo pipefail
          img="${{ env.LOCAL_TAG }}"
          docker run --rm --user hermes \
            -e PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint bash "$img" -c '
              set -euo pipefail
              resolved=$(command -v hermes)
              echo "hermes=$resolved"
              test "$resolved" = /usr/local/bin/hermes
              hermes --version
            '

      - name: Smoke test — certifi/Pillow/brotlicffi/PyJWT patchés + imports hermes
        run: |
          set -euo pipefail
          img="${{ env.LOCAL_TAG }}"
          docker run --rm --user hermes --entrypoint /opt/hermes/.venv/bin/python "$img" -c "
          from importlib.metadata import version
          from PIL import Image
          import brotlicffi, certifi, jwt, hermes_cli.main, browser_harness
          cert_v, pil_v, br_v, jwt_v = version('certifi'), version('pillow'), version('brotlicffi'), version('PyJWT')
          print('certifi', cert_v, 'pillow', pil_v, 'brotlicffi', br_v, 'pyjwt', jwt_v)
          assert tuple(int(x) for x in cert_v.split('.')) >= (2026, 10, 19), cert_v
          assert tuple(int(x) for x in pil_v.split('.')) >= (13, 0, 0), pil_v
          assert tuple(int(x) for x in br_v.split('.')) >= (1, 2, 1, 0), br_v
          assert tuple(int(x) for x in jwt_v.split('.')) >= (2, 14, 0), jwt_v
          assert jwt.decode(jwt.encode({'ok': 1}, 'k' * 32, algorithm='HS256'), 'k' * 32, algorithms=['HS256']) == {'ok': 1}
          assert brotlicffi.decompress(brotlicffi.compress(b'ok')) == b'ok'
          Image.new('RGB', (4, 4), color=(0, 128, 255))
          print('imports_ok')
          "

      - name: Scan de vulnérabilités — rapport (informatif)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

      # Porte bloquante : exit-code 1 si CRITICAL corrigible hors .trivyignore.
      # continue-on-error pour pouvoir ouvrir/mettre à jour l'issue avant de
      # faire échouer le job (pas de publish).
      - name: Porte bloquante — nouvelles CRITICAL corrigibles
        id: trivy_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          format: table
          output: trivy-critical.txt
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

      - name: Ouvrir / mettre à jour l'issue si la porte Trivy échoue
        if: steps.trivy_gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Le tableau « Report Summary » liste chaque fichier scanné (milliers
          # de lignes) : passé en argument il dépassait ARG_MAX (`gh: Argument
          # list too long`, exit 126) et la limite de 65 536 caractères d'un
          # body GitHub. On le retire, on borne le reste et on passe par
          # --body-file.
          if [ -f trivy-critical.txt ]; then
            REPORT=$(awk '/^Report Summary/{skip=1} skip && /^└/{skip=0; next} !skip' trivy-critical.txt | head -c 50000)
          else
            REPORT="(rapport Trivy indisponible)"
          fi
          cat > /tmp/issue-body.md <<EOF
          ## Rebuild sécurité hebdomadaire — porte Trivy CRITICAL en échec

          Run : ${RUN_URL}

          Aucune image n'a été publiée. Corriger les CRITICAL corrigibles
          (apt/pip/Dockerfile) ou documenter un reliquat non patchable dans
          \`.trivyignore\` (S-03), puis relancer ce workflow.

          \`\`\`
          ${REPORT}
          \`\`\`
          EOF
          # Normaliser l'indentation du heredoc (les espaces YAML).
          sed -i 's/^          //' /tmp/issue-body.md
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search "\"${ISSUE_TITLE}\" in:title state:open" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file /tmp/issue-body.md
            echo "Issue #$EXISTING mise à jour."
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body-file /tmp/issue-body.md
            echo "Issue créée."
          fi
          echo "::error::Porte Trivy CRITICAL en échec — pas de publication."
          exit 1

      - name: Fermer l'issue sécurité ouverte si la porte est verte
        if: steps.trivy_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search "\"${ISSUE_TITLE}\" in:title state:open" \
            --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            echo "Aucune issue ouverte à fermer."
            exit 0
          fi
          gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body \
            "Porte Trivy CRITICAL verte sur le rebuild hebdomadaire (${RUN_URL}). Fermeture automatique."
          gh issue close "$EXISTING" --repo "${{ github.repository }}"

      # Content-manifest : contenu réel, pas le digest d'image (timestamps).
      # Sections : dpkg-query -W trié, freeze-like du venv (importlib.metadata —
      # pip est retiré de l'image), versions outils + certifi vendored tools.
      - name: Préparer le script d'extraction du content-manifest
        run: |
          set -euo pipefail
          cat > /tmp/extract-manifest.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          echo "### dpkg"
          dpkg-query -W -f='${Package}\t${Version}\n' | LC_ALL=C sort
          echo "### venv"
          /opt/hermes/.venv/bin/python -c '
          from importlib.metadata import distributions
          rows = []
          for d in distributions():
              name = d.metadata["Name"]
              rows.append(f"{name}=={d.version}")
          for line in sorted(rows, key=str.lower):
              print(line)
          '
          echo "### tools"
          gws --version 2>&1 | head -n 1
          gh --version 2>&1 | head -n 1
          kubectl version --client 2>&1 | head -n 2
          /usr/local/bin/python3 -c 'import pip._vendor.certifi as c; print("vendor-certifi", c.__version__)' 2>&1 | head -n 1
          SCRIPT
          # Retirer l'indentation YAML du heredoc.
          sed -i 's/^          //' /tmp/extract-manifest.sh
          chmod +x /tmp/extract-manifest.sh

      - name: Extraire le content-manifest du candidat
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash \
            -v /tmp/extract-manifest.sh:/tmp/extract-manifest.sh:ro \
            "${{ env.LOCAL_TAG }}" /tmp/extract-manifest.sh \
            > /tmp/manifest-candidate.txt
          echo "::group::Content-manifest (candidat)"
          wc -l /tmp/manifest-candidate.txt
          head -n 5 /tmp/manifest-candidate.txt
          echo "..."
          echo "::endgroup::"

      - name: Comparer au content-manifest de latest publié
        id: compare
        run: |
          set -euo pipefail
          LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if ! docker pull "$LATEST"; then
            echo "Aucune image latest joignable — publication forcée (premier run)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker run --rm --entrypoint bash \
            -v /tmp/extract-manifest.sh:/tmp/extract-manifest.sh:ro \
            "$LATEST" /tmp/extract-manifest.sh \
            > /tmp/manifest-latest.txt
          if cmp -s /tmp/manifest-candidate.txt /tmp/manifest-latest.txt; then
            echo "no change — content-manifest identique à latest ; pas de publication."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::group::Diff content-manifest (latest → candidat)"
            diff -u /tmp/manifest-latest.txt /tmp/manifest-candidate.txt || true
            echo "::endgroup::"
            echo "Content-manifest différent — publication calver."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute calver tag (vYYYY.M.D[.N])
        id: tag
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="v$(date -u +%Y.%-m.%-d)"
          TAG="$BASE"
          N=1
          while gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; do
            TAG="${BASE}.$N"
            N=$((N+1))
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Release + publish uniquement si le content-manifest a changé. On
  # reconstruit via build-image.yml (no_cache) pour conserver attestation /
  # tags calver + latest comme sur le chemin auto-release.
  publish:
    needs: rebuild
    if: needs.rebuild.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release
        env:
          TAG: ${{ needs.rebuild.outputs.tag }}
          # GITHUB_TOKEN suffit : le build suit dans ce même workflow (pas via
          # release: published / anti-récursion).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          ## Rebuild sécurité hebdomadaire

          Rebuild \`--no-cache\` : le content-manifest (dpkg + venv + outils)
          diffère de l'image \`latest\` publiée. Tags calver + \`latest\` pour
          Image Updater.

          - Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Aucun secret dans l'image (credentials sur PVC / Infisical).
          EOF
          )
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^          //')
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "hermes-lya-config $TAG" \
            --notes "$NOTES"

  build:
    needs: [rebuild, publish]
    if: needs.rebuild.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      publish_release_tags: true
      release_tag: ${{ needs.rebuild.outputs.tag }}
      no_cache: true
    secrets: inherit
