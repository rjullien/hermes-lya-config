name: Build Image (reusable)
# Workflow réutilisable (workflow_call) : build + push de l'image sur GHCR.
# Appelé par build.yml (release publiée ou workflow_dispatch) ET par
# auto-release.yml (après la création de la release, dans le MÊME run, sans
# dépendre de l'event `release: published` que la protection anti-récursion de
# GitHub supprime quand la release est créée par un workflow).
#
# F-02 — Les tags calver (vX.Y.Z, vX.Y) et `latest` ne sont émis QUE quand
# l'appelant est une vraie release. C'est piloté par l'input explicite
# `publish_release_tags`, PAS par `github.event_name` : dans un workflow appelé,
# `github.event_name` reflète l'event de l'APPELANT (un `push` pour
# auto-release.yml), donc s'y fier casserait les tags sur ce chemin. Un
# `workflow_dispatch` sur build.yml passe `false` et ne produit que `sha-<commit>`,
# il ne peut donc pas déplacer `latest`.

on:
  workflow_call:
    inputs:
      publish_release_tags:
        description: "Émettre les tags calver (vX.Y.Z, vX.Y) et latest. Vrai uniquement pour une release."
        required: false
        type: boolean
        default: false
      release_tag:
        description: >-
          Tag calver de la release (ex. v2026.9.7). Requis quand
          publish_release_tags=true et que l'appelant n'est pas déclenché par
          l'event release lui-même : sur le chemin auto-release.yml (push sur
          main) `github.ref` vaut refs/heads/main, donc `type=semver` n'a aucun
          tag à parser et doit recevoir la version explicitement via `value=`.
          Laissé vide sur le chemin release: build.yml (github.ref porte déjà le
          tag) et sur workflow_dispatch (aucun tag calver émis).
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # F-02 — `latest` et les tags calver ne sont publiés QUE pour une
          # release, via l'input `publish_release_tags` (voir en-tête). Un
          # `workflow_dispatch` passe `false` et ne produit que `sha-<commit>`.
          tags: |
            type=semver,pattern=v{{version}},value=${{ inputs.release_tag }},enable=${{ inputs.publish_release_tags }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.publish_release_tags }}
            type=raw,value=latest,enable=${{ inputs.publish_release_tags }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate artifact attestation
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
